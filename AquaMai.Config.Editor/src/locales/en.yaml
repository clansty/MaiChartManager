    helpText: |-
      Sensitivity in Test mode is not linear
      Area A default sensitivity: 90, 80, 70, 60, 50, 40, 30, 26, 23, 20, 10
      Other areas default sensitivity: 70, 60, 50, 40, 30, 20, 15, 10, 5, 1, 1
      Test 0 corresponds to 40, 20 level, -5 is 90, 70, +5 is 10, 1
      Higher level in Test, lower number here = higher sensitivity for official cabinet
      ADX sensitivity is reversed, so higher number here = higher sensitivity for ADX
    selectAreaHint: Select an area on the left to fine-tune sensitivity here
